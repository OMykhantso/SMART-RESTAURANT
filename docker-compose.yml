# Smart Restaurant — повний стек однією командою:
#   docker compose up -d --build
# Web:     http://localhost:8080
# API:     http://localhost:4000/api   (Swagger: /api/docs)
# Mobile:  cd mobile && npm install && npx expo start  (API — порт 4000 цього компʼютера)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_restaurant
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart -d smart_restaurant']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smart:smart@db:5432/smart_restaurant?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-please}
      CORS_ORIGIN: '*'
      PORT: 4000
      SEED_ON_START: 'true'
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - uploads:/app/uploads

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
  uploads:
