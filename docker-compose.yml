# Smart Restaurant — повний стек однією командою:
#   docker compose up -d --build
# Web:     https://localhost:8443  (http://localhost:8080 перенаправляє на HTTPS)
#          «замочок» без попереджень браузера: ./scripts/setup-https.sh (один раз, потрібен mkcert)
# Restaurant API: http://localhost:4000/api   (Swagger: /api/docs)
# Delivery API:   http://localhost:4100/api   (Swagger: /api/docs) — окремий сервіс доставки, та сама БД
# Mobile:  cd mobile && npm install && npx expo start  (порти 4000 і 4100 цього компʼютера)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_restaurant
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart -d smart_restaurant']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smart:smart@db:5432/smart_restaurant?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-please}
      CORS_ORIGIN: '*'
      PORT: 4000
      SEED_ON_START: 'true'
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - uploads:/app/uploads

  # Окремий сервіс служби доставки: власний процес, порт, Socket.IO і Swagger.
  # Спільні з Restaurant API лише база даних і обліковий запис (той самий JWT).
  # Міграції застосовує backend, тому стартуємо після нього.
  delivery:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ['node', 'dist/delivery/server.js']
    environment:
      DATABASE_URL: postgresql://smart:smart@db:5432/smart_restaurant?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-please}
      CORS_ORIGIN: '*'
      DELIVERY_PORT: 4100
      # true — приймати доставки й поза годинами роботи (для демонстрацій увечері)
      DELIVERY_IGNORE_HOURS: ${DELIVERY_IGNORE_HOURS:-false}
    ports:
      - '${DELIVERY_PORT:-4100}:4100'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
      - delivery
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - '${WEB_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      # сертифікат localhost: від mkcert (scripts/setup-https.sh) або самопідписаний, створений контейнером
      - ./certs:/etc/nginx/certs

volumes:
  pgdata:
  uploads:
