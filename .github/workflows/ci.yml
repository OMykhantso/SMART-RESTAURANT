name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint · ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  backend:
    name: Backend · typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smart
          POSTGRES_PASSWORD: smart
          POSTGRES_DB: smart_restaurant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://smart:smart@localhost:5432/smart_restaurant_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      # увесь набір 7 разів — ніби сьогодні кожен день тижня (графік роботи різний)
      - run: npm run test:weekdays
      - run: npm run build

  web:
    name: Web · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  e2e:
    name: E2E · Playwright (Web + Restaurant API + Delivery API)
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smart
          POSTGRES_PASSWORD: smart
          POSTGRES_DB: smart_restaurant
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://smart:smart@localhost:5432/smart_restaurant?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      # доставку перевіряємо в будь-який час запуску CI
      DELIVERY_IGNORE_HOURS: 'true'
      PAYMENT_SANDBOX_LATENCY_MS: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: web
      - name: Database — migrations + demo data
        working-directory: backend
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts
      - run: npx playwright install --with-deps chromium
      - name: Start Restaurant API, Delivery API and Web
        run: |
          (cd backend && nohup npx tsx src/server.ts > ../api.log 2>&1 &)
          (cd backend && nohup npx tsx src/delivery/server.ts > ../delivery.log 2>&1 &)
          (cd web && nohup npx vite --port 5173 --strictPort > ../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf localhost:4000/api/health > /dev/null && curl -sf localhost:4100/api/health > /dev/null && curl -sf localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          cat api.log delivery.log web.log; exit 1
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results
            api.log
            delivery.log
            web.log
